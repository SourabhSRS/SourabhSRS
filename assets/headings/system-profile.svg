<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90">
<defs>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ff0033"/><stop offset="1" stop-color="#ff0033" stop-opacity="0"/></linearGradient>
  <linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  text{font-family:'JetBrains Mono',Consolas,monospace}
  .u{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease-out forwards;transform:scaleX(0)}
  @keyframes grow{to{transform:scaleX(1)}}
  .sw{animation:sw 3.5s ease-in-out infinite}
  @keyframes sw{0%{transform:translateX(-120px)}100%{transform:translateX(1100px)}}
  .b{animation:bl 1.2s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
<rect width="1000" height="90" fill="#070707"/>
<path d="M30 22L42 68M46 22L58 68" stroke="#ff0033" stroke-width="5"/>
<text x="78" y="56" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="2">01 <tspan fill="#ff0033">//</tspan> SYSTEM PROFILE</text>
<text x="970" y="56" fill="#ff0033" font-size="20" text-anchor="end" class="b">_</text>
<rect class="u" x="0" y="84" width="1000" height="3" fill="url(#ln)"/>
<rect class="sw" x="0" y="0" width="120" height="90" fill="url(#sc)" opacity=".12"/>
</svg>
