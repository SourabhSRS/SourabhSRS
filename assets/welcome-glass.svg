<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff0033" stop-opacity=".9"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/>
    <stop offset="1" stop-color="#ff0033" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect x="4" y="4" width="992" height="162" rx="18"/></clipPath>
</defs>
<style>
  text{font-family:'JetBrains Mono',Consolas,monospace}
  .sh{animation:shine 5s ease-in-out infinite}
  @keyframes shine{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1400px)}}
  .pulse{animation:pulse 2.5s ease-in-out infinite}
  @keyframes pulse{50%{stroke-opacity:.25}}
  .fade{opacity:0;animation:fi 1s .3s forwards}
  @keyframes fi{to{opacity:1}}
</style>
<rect x="4" y="4" width="992" height="162" rx="18" fill="#ffffff" fill-opacity=".04" stroke="url(#edge)" stroke-width="2" class="pulse"/>
<rect x="4" y="4" width="992" height="162" rx="18" fill="#0a0a0a" fill-opacity=".75" style="mix-blend-mode:multiply"/>
<g clip-path="url(#card)">
  <rect class="sh" x="0" y="0" width="260" height="170" fill="url(#shine)"/>
</g>
<path d="M40 30L50 80M52 30L62 80" stroke="#ff0033" stroke-width="5"/>
<g class="fade">
  <text x="90" y="62" fill="#ffffff" font-size="34" font-weight="800">WELCOME, OPERATOR</text>
  <text x="90" y="95" fill="#ff3347" font-size="17">&gt; identity verified :: SOURABH SRS</text>
  <text x="90" y="122" fill="#9a9a9a" font-size="15">Computer Science Engineering // AI // Robotics // Drones</text>
  <text x="90" y="148" fill="#00ff66" font-size="13">[ STATUS: ONLINE ]  [ MODE: ACTIVE BUILD ]</text>
</g>
<text x="940" y="150" fill="#ff0033" font-size="40" font-weight="800" opacity=".25">//</text>
</svg>
