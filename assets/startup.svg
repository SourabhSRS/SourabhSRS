<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="1" height="22" fill="#ffffff" fill-opacity=".05"/>
  </pattern>
  <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#e10600"/><stop offset="1" stop-color="#e10600" stop-opacity="0"/></linearGradient>
  <style>
    text{font-family:Orbitron,Eurostile,'Arial Black',Impact,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,monospace}
    .hatch{animation:hatch 6s linear infinite}
    @keyframes hatch{to{transform:translate(22px,0)}}
    .slab{transform-box:fill-box;transform-origin:left center;animation:slab 1.1s cubic-bezier(.7,0,.2,1) both}
    .s2{animation-delay:.15s}.s3{animation-delay:.3s}
    @keyframes slab{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .title{fill:#f4f4f4;font-size:64px;font-weight:900;letter-spacing:3px;animation:rise .8s .4s both}
    .glitch{fill:#e10600;font-size:64px;font-weight:900;letter-spacing:3px;animation:glitch 5s steps(1) infinite;mix-blend-mode:screen}
    @keyframes glitch{0%,88%,100%{opacity:0;transform:translate(0,0)}89%{opacity:.9;transform:translate(-6px,0)}91%{opacity:.9;transform:translate(7px,-1px)}93%{opacity:0}}
    .sub{fill:#8a8a8a;font-size:13px;letter-spacing:4px;animation:rise .8s .7s both}
    .line{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;fill:#f4f4f4;opacity:0;animation:show .25s forwards}
    .l1{animation-delay:1.3s}.l2{animation-delay:1.6s}.l3{animation-delay:1.9s}
    @keyframes show{to{opacity:1}}
    .scan{fill:url(#fadeR);animation:scan 3.6s linear infinite}
    @keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(266px)}}
    .blink{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .ghost{fill:none;stroke:#ffffff;stroke-opacity:.09;stroke-width:1.5;font-size:200px;font-weight:900}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  </style>
</defs>
<rect width="1000" height="260" fill="#07080a"/>
<rect width="1000" height="260" fill="url(#hatch)" class="hatch"/>
<polygon class="slab" points="60,40 96,40 62,220 26,220" fill="#e10600"/>
<polygon class="slab s2" points="108,40 116,40 82,220 74,220" fill="#f4f4f4" fill-opacity=".85"/>
<polygon class="slab s3" points="130,40 1000,40 1000,44 134,44" fill="#e10600" fill-opacity=".5"/>
<text class="ghost" x="560" y="210" text-anchor="end">SRS</text>
<text class="title" x="150" y="118">SOURABH_SRS</text>
<text class="glitch" x="150" y="118">SOURABH_SRS</text>
<text class="sub" x="152" y="150">COMPUTER SCIENCE // AI // ROBOTICS // DRONES</text>
<text class="line l1" x="152" y="186"><tspan fill="#e10600">&gt;&gt;</tspan> BOOT SEQUENCE INITIATED</text>
<text class="line l2" x="152" y="206"><tspan fill="#e10600">&gt;&gt;</tspan> LOADING AI / ROBOTICS / UAV MODULES</text>
<text class="line l3" x="152" y="226"><tspan fill="#e10600">&gt;&gt;</tspan> ACCESS GRANTED<tspan class="blink" fill="#e10600">_</tspan></text>
<rect class="scan" x="0" y="0" width="1000" height="6"/>
</svg>
