<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0d070a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ff2020" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2020" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2020" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff2020" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" rx="14" fill="url(#bgGrad)" stroke="#ff2020" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)"/>

  <!-- Animated Scanline -->
  <rect x="0" y="-40" width="1000" height="3" fill="url(#redGlow)" opacity="0.6">
    <animate attributeName="y" values="0;260;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Frosted Glass Main HUD Panel -->
  <rect x="35" y="25" width="930" height="210" rx="12" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  
  <!-- HUD Corner Brackets -->
  <path d="M 35 55 L 35 25 L 65 25" fill="none" stroke="#ff2020" stroke-width="3" filter="url(#glow)"/>
  <path d="M 935 25 L 965 25 L 965 55" fill="none" stroke="#ff2020" stroke-width="3" filter="url(#glow)"/>
  <path d="M 35 205 L 35 235 L 65 235" fill="none" stroke="#ff2020" stroke-width="3" filter="url(#glow)"/>
  <path d="M 935 235 L 965 235 L 965 205" fill="none" stroke="#ff2020" stroke-width="3" filter="url(#glow)"/>

  <!-- Animated Radar / Drone Reticle Left -->
  <g transform="translate(130, 130)">
    <circle cx="0" cy="0" r="62" fill="none" stroke="#ff2020" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ff2020" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="45 25">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="28" fill="#ff2020" fill-opacity="0.12" stroke="#ff2020" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#ff2020" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Welcome Status Pill -->
  <rect x="235" y="48" width="340" height="26" rx="6" fill="#ff2020" fill-opacity="0.15" stroke="#ff2020" stroke-width="1"/>
  <circle cx="252" cy="61" r="4.5" fill="#00ff66">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="266" y="65" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#ffffff" letter-spacing="2">SYSTEM ONLINE // WELCOME VISITOR</text>

  <!-- Main Title -->
  <text x="235" y="132" font-family="'Segoe UI', 'Ubuntu', sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#glow)">SOURABH <tspan fill="#ff2020">SRS</tspan></text>

  <!-- Subtitle -->
  <text x="235" y="168" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" font-weight="600" fill="#cccccc" letter-spacing="3.5">CSE ENGINEER · AI EXPLORER · ROBOTICS &amp; DRONES</text>

  <!-- Animated Progress / Telemetry Bar -->
  <rect x="235" y="192" width="520" height="6" rx="3" fill="#222222"/>
  <rect x="235" y="192" width="420" height="6" rx="3" fill="#ff2020" filter="url(#glow)">
    <animate attributeName="width" values="120;520;360;480;120" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Right Side Telemetry Readout -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#888888" text-anchor="end">
    <text x="935" y="65" fill="#ff2020" font-weight="bold">SYS.VER // 4.2.0</text>
    <text x="935" y="85">CORE: ACTIVE</text>
    <text x="935" y="105">AI_MOD: LOADED</text>
    <text x="935" y="125">UAV_NAV: READY</text>
    <text x="935" y="200" fill="#ffffff">LOC // INDIA</text>
  </g>
</svg>