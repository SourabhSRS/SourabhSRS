<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#030303"/>
    <stop offset=".72" stop-color="#080808"/>
    <stop offset="1" stop-color="#160000"/>
  </linearGradient>
  <linearGradient id="red" x1="0" x2="1">
    <stop offset="0" stop-color="#6b0000"/>
    <stop offset=".5" stop-color="#ff2020"/>
    <stop offset="1" stop-color="#ff5555"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="reveal">
    <rect x="0" y="0" width="0" height="360">
      <animate attributeName="width" from="0" to="1200" dur="2.2s" fill="freeze"/>
    </rect>
  </clipPath>
</defs>

<rect width="1200" height="360" fill="url(#bg)"/>

<g opacity=".08" stroke="#ff2020">
  <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
</g>

<g filter="url(#glow)">
  <path d="M70 285 L300 285 L360 95" fill="none" stroke="url(#red)" stroke-width="3"/>
  <path d="M900 285 L1130 285" fill="none" stroke="#ff2020" stroke-width="3"/>
</g>

<g clip-path="url(#reveal)">
  <text x="600" y="160"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="800"
        letter-spacing="12">SOURABH SRS</text>

  <text x="600" y="205"
        text-anchor="middle"
        fill="#ff3030"
        font-family="monospace"
        font-size="16"
        font-weight="700"
        letter-spacing="5">ENGINEERING // AI // ROBOTICS // DRONES</text>
</g>

<g>
  <rect x="70" y="310" width="1060" height="2" fill="#300000"/>
  <rect x="70" y="310" width="0" height="2" fill="#ff2020">
    <animate attributeName="width" from="0" to="1060" dur="1.8s" begin=".4s" fill="freeze"/>
  </rect>
</g>

<text x="600" y="255"
      text-anchor="middle"
      fill="#777777"
      font-family="monospace"
      font-size="12"
      letter-spacing="4"
      opacity="0">
  SYSTEM ONLINE // BUILD MODE
  <animate attributeName="opacity" values="0;1;1" dur="1.8s" begin="1.7s" fill="freeze"/>
</text>
</svg>
