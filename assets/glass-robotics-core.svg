<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270">
<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  @keyframes scan{from{transform:translateY(0)}to{transform:translateY(230px)}}
  .scan{animation:scan 3.2s linear infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
  .rev{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wk{animation:blink 1.8s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
</style>
<defs><clipPath id="c1"><polygon points="46,20 240,20 240,224 214,250 20,250 20,46"/></clipPath></defs>
<polygon points="46,20 240,20 240,224 214,250 20,250 20,46" fill="#0c0d10" stroke="#2a2a2e" stroke-width="1.2"/>
<g clip-path="url(#c1)"><rect class="scan" style="animation-delay:-100ms" x="20" y="20" width="220" height="3" fill="#e10600" fill-opacity=".7"/></g>
<rect x="44" y="50" width="30" height="3" fill="#e10600" class="wk"/>
<g transform="translate(130,96)"><text x="0" y="10" text-anchor="middle" fill="#e10600" font-size="34" font-weight="700" style="font-family:'JetBrains Mono',Consolas,monospace">&lt;/&gt;</text></g>
<text x="130" y="196" text-anchor="middle" fill="#f4f4f4" font-size="15" font-weight="800" letter-spacing="2" style="font-family:Orbitron,Eurostile,'Arial Black',Impact,sans-serif">SOFTWARE</text>
<text x="130" y="218" text-anchor="middle" fill="#8a8a8a" font-size="11" style="font-family:'JetBrains Mono',Consolas,monospace">code and systems</text>
