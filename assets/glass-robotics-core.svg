<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ff2020" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="14" fill="#050505"/>

  <!-- Card 1: SOFTWARE -->
  <g transform="translate(15, 15)">
    <rect width="225" height="190" rx="12" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="100" y2="0" stroke="#ff2020" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="35" cy="35" r="14" fill="#ff2020" fill-opacity="0.2" stroke="#ff2020" stroke-width="1.5"/>
    <text x="35" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">01</text>
    <text x="62" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">SOFTWARE</text>
    <line x1="20" y1="62" x2="205" y2="62" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="25" y="95" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Python &amp; C++</text>
    <text x="25" y="125" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Data Structures</text>
    <text x="25" y="155" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2020">▸ System Design</text>
  </g>

  <!-- Card 2: INTELLIGENCE -->
  <g transform="translate(263, 15)">
    <rect width="225" height="190" rx="12" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="100" y2="0" stroke="#ff2020" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="35" cy="35" r="14" fill="#ff2020" fill-opacity="0.2" stroke="#ff2020" stroke-width="1.5"/>
    <text x="35" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">02</text>
    <text x="62" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">INTELLIGENCE</text>
    <line x1="20" y1="62" x2="205" y2="62" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="25" y="95" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Applied AI &amp; ML</text>
    <text x="25" y="125" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Computer Vision</text>
    <text x="25" y="155" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2020">▸ Neural Networks</text>
  </g>

  <!-- Card 3: ROBOTICS -->
  <g transform="translate(511, 15)">
    <rect width="225" height="190" rx="12" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="100" y2="0" stroke="#ff2020" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="35" cy="35" r="14" fill="#ff2020" fill-opacity="0.2" stroke="#ff2020" stroke-width="1.5"/>
    <text x="35" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">03</text>
    <text x="62" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">ROBOTICS</text>
    <line x1="20" y1="62" x2="205" y2="62" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="25" y="95" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Smart Automation</text>
    <text x="25" y="125" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Sensor Fusion</text>
    <text x="25" y="155" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2020">▸ Control Systems</text>
  </g>

  <!-- Card 4: AUTONOMY -->
  <g transform="translate(759, 15)">
    <rect width="225" height="190" rx="12" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="100" y2="0" stroke="#ff2020" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="35" cy="35" r="14" fill="#ff2020" fill-opacity="0.2" stroke="#ff2020" stroke-width="1.5"/>
    <text x="35" y="40" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">04</text>
    <text x="62" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">AUTONOMY</text>
    <line x1="20" y1="62" x2="205" y2="62" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="25" y="95" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Drone Systems</text>
    <text x="25" y="125" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e0e0e0">▸ Path Navigation</text>
    <text x="25" y="155" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2020">▸ Autonomous UAVs</text>
  </g>
</svg>