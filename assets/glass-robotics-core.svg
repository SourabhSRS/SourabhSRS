<text x="370" y="196" text-anchor="middle" fill="#f4f4f4" font-size="15" font-weight="800" letter-spacing="2" style="font-family:Orbitron,Eurostile,'Arial Black',Impact,sans-serif">INTELLIGENCE</text>
